site_name: 从 Go、Docker、Kubernetes 到 Operator
site_description: 一套面向中高级云原生工程能力的系统教程 - 40 大篇 200 个章节，围绕 Cloud Native Todo Platform 项目主线
site_author: yuanxuefeng
site_url: https://docs.yxuefeng.com/

repo_name: cloud-native-todo-platform-docs
repo_url: https://github.com/yleoer/cloud-native-todo-platform-docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 yuanxuefeng

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    # 导航
    - navigation.tabs              # 顶部标签页导航
    - navigation.tabs.sticky       # 标签页固定在顶部
    - navigation.sections          # 侧边栏分组
    - navigation.expand            # 默认展开所有章节
    - navigation.path              # 显示面包屑导航
    - navigation.top               # 返回顶部按钮
    - navigation.footer            # 底部上一页/下一页导航
    - navigation.tracking          # 锚点跟踪

    # 搜索
    - search.highlight             # 搜索结果高亮
    - search.suggest               # 搜索建议
    - search.share                 # 搜索分享

    # 内容
    - content.code.copy            # 代码复制按钮
    - content.code.annotate        # 代码注释
    - content.tabs.link            # 内容标签页链接
    - content.tooltips             # 工具提示
    - content.action.edit          # 编辑此页
    - content.action.view          # 查看源码

    # 其他
    - toc.follow                   # 目录跟随

  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

  font:
    text: Noto Sans SC
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s​\-]'

  - tags

  # 显示最后更新时间
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: true
      enable_git_follow: false

markdown_extensions:
  # 基础扩展
  - abbr                           # 缩写
  - admonition                     # 提示框
  - attr_list                      # 属性列表
  - def_list                       # 定义列表
  - footnotes                      # 脚注
  - md_in_html                     # HTML 中的 Markdown
  - meta                           # 元数据

  # 目录
  - toc:
      permalink: true
      permalink_title: 锚点链接
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # 表格
  - tables

  # PyMdown 扩展
  - pymdownx.arithmatex:           # 数学公式
      generic: true
  - pymdownx.betterem:             # 更好的强调
      smart_enable: all
  - pymdownx.caret                 # 上标和插入
  - pymdownx.mark                  # 标记
  - pymdownx.tilde                 # 下标和删除
  - pymdownx.critic                # 批注
  - pymdownx.details               # 可折叠块
  - pymdownx.emoji:                # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:            # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      linenums: true
  - pymdownx.inlinehilite          # 行内代码高亮
  - pymdownx.keys                  # 键盘按键
  - pymdownx.magiclink:            # 自动链接
      repo_url_shorthand: true
      user: yleoer
      repo: cloud-native-todo-platform-docs
  - pymdownx.smartsymbols          # 智能符号
  - pymdownx.snippets:             # 代码片段
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:          # 超级围栏
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:               # 标签页
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:             # 任务列表
      custom_checkbox: true
      clickable_checkbox: false

extra:
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yleoer
      name: GitHub

  # 版本
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

